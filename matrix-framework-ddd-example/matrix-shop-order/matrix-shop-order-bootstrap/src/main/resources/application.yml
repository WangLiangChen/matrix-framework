spring:
  application:
    name: matrix-shop-order
  datasource:
    url: jdbc:postgresql://localhost:5432/matrix_shop
    driver-class-name: org.postgresql.jdbc.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8082

# 订单上下文（下游）访问商品上下文（上游）开放主机服务的地址
matrix:
  shop:
    order:
      product-service-url: http://localhost:8081
